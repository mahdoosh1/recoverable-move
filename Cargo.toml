[package]
name = "recoverable-move"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Crash-recoverable relocation of an overlapping GPT partition"
repository = "https://github.com/mahdoosh1/recoverable-move"
readme = "README.md"
keywords = ["gpt", "partition", "recovery", "disk"]
categories = ["filesystem", "command-line-utilities"]
exclude = [
    ".github/**",
]

[dependencies]
gptman = "3.1.1"
crc = "3.4.0"
