
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-features

      - name: Build
        run: cargo build --release --locked

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp target/release/recoverable-move dist/recoverable-move-linux-x86_64

      - name: Generate Release Notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$GITHUB_SHA"
          else
            RANGE="$GITHUB_SHA"
          fi

          git log "$RANGE" \
            --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
            > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            dist/recoverable-move-linux-x86_64
