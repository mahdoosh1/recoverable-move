name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-features

      - name: Build
        run: cargo build --release --locked

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp target/release/recoverable-move dist/recoverable-move-linux-x86_64
          cd dist
          sha256sum recoverable-move-linux-x86_64 > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/recoverable-move-linux-x86_64
            dist/SHA256SUMS